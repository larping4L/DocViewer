<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocViewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ececea;
      --surface: #ffffff;
      --surface-2: #e4e4e0;
      --border: #141414;
      --text: #141414;
      --text-muted: #595955;
      --inv-bg: #141414;
      --inv-text: #ffffff;
      --danger: #141414;
      --shadow-hard: 4px 4px 0px #141414;
      --shadow-hard-sm: 2px 2px 0px #141414;
      --ui-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono-font: 'JetBrains Mono', monospace;
    }
    html.dark {
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-2: #262626;
      --border: #e8e8e8;
      --text: #f0f0f0;
      --text-muted: #9e9e9e;
      --inv-bg: #f0f0f0;
      --inv-text: #111111;
      --shadow-hard: 4px 4px 0px #e8e8e8;
      --shadow-hard-sm: 2px 2px 0px #e8e8e8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--ui-font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar — strictly aligned single-row grid/flex */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 9px 16px;
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }
    .file-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      min-width: 0;
      flex: 1;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .file-name {
      color: var(--text);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 0;
      font-family: var(--mono-font);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .badge.accent {
      background: var(--inv-bg);
      color: var(--inv-text);
      border-color: var(--border);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      height: 34px;
      font-family: var(--ui-font);
      font-size: 13px;
      font-weight: 500;
      border-radius: 0;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      box-shadow: var(--shadow-hard-sm);
      transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      line-height: 1;
    }
    select {
      padding-right: 10px;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      background: var(--surface-2);
    }
    button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--border);
    }
    button:disabled, select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.primary {
      background: var(--inv-bg);
      color: var(--inv-text);
      border-color: var(--border);
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) {
      opacity: 0.88;
      background: var(--inv-bg);
    }

    .px-ico {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: block;
    }

    .convert-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Workspace — clean flat slightly gray background */
    .workspace {
      position: relative;
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* Dropzone */
    .dropzone-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .dropzone {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 0;
      padding: 36px 32px;
      text-align: center;
      box-shadow: var(--shadow-hard);
      transition: transform 0.1s ease, background 0.1s ease;
      cursor: pointer;
    }
    .dropzone.dragover {
      background: var(--surface-2);
      transform: translate(-2px, -2px);
    }
    .drop-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      border: 1.5px solid var(--border);
      background: var(--inv-bg);
      color: var(--inv-text);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-hard-sm);
    }
    .dropzone h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .dropzone p {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .format-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 22px;
    }
    .drop-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hint-footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--surface-2);
      font-size: 12px;
      color: var(--text-muted);
    }
    kbd {
      font-family: var(--mono-font);
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Viewer Container */
    .viewer {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }
    .viewer.active {
      display: flex;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      background: #404040;
    }

    /* Original-fidelity DOCX wrapper */
    .docx-host {
      flex: 1;
      overflow: auto;
      padding: 24px 16px 48px;
    }
    .docx-host .docx-wrapper {
      background: transparent !important;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }
    .docx-host .docx-wrapper > section.docx {
      background: #ffffff !important;
      color: #000000 !important;
      border: 1.5px solid #141414 !important;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2) !important;
      margin-bottom: 0 !important;
      flex-shrink: 0;
    }

    /* Generic document / table / markdown / code page */
    .doc-page-wrap {
      flex: 1;
      overflow: auto;
      padding: 28px 16px 48px;
    }
    .doc-page {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      color: #141414;
      border: 1.5px solid var(--border);
      border-radius: 0;
      box-shadow: var(--shadow-hard);
      padding: 36px 42px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.65;
      font-size: 15px;
      overflow-wrap: break-word;
    }
    .doc-page h1, .doc-page h2, .doc-page h3, .doc-page h4 {
      margin-top: 1.3em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }
    .doc-page h1:first-child, .doc-page h2:first-child { margin-top: 0; }
    .doc-page p { margin: 0 0 0.9em; }
    .doc-page img { max-width: 100%; height: auto; }
    .doc-page table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13.5px;
      display: block;
      overflow-x: auto;
    }
    .doc-page th, .doc-page td {
      border: 1px solid #141414;
      padding: 7px 10px;
      text-align: left;
    }
    .doc-page th {
      background: #ececea;
      font-weight: 600;
    }
    .doc-page pre {
      background: #f4f4f2;
      border: 1.5px solid #141414;
      border-radius: 0;
      padding: 14px;
      overflow-x: auto;
      font-family: var(--mono-font);
      font-size: 13px;
      line-height: 1.5;
      color: #141414;
    }
    .doc-page code {
      font-family: var(--mono-font);
      font-size: 0.9em;
      background: #ececea;
      padding: 1px 5px;
    }
    .doc-page pre code { background: none; padding: 0; }

    .notice-banner {
      max-width: 820px;
      margin: 0 auto 14px;
      padding: 10px 14px;
      border-radius: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-hard-sm);
      font-size: 12.5px;
      color: var(--text);
    }

    .sheet-tabs {
      display: flex;
      gap: 6px;
      max-width: 1000px;
      margin: 0 auto 12px;
      flex-wrap: wrap;
    }
    .sheet-tab.active {
      background: var(--inv-bg);
      color: var(--inv-text);
      border-color: var(--border);
    }

    .img-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    .img-view img {
      max-width: 100%;
      max-height: 100%;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-hard);
      object-fit: contain;
      background: #fff;
    }

    .drag-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.78);
      border: 4px dashed #ffffff;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      pointer-events: none;
    }
    .drag-overlay.visible { display: flex; }

    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: var(--inv-bg);
      color: var(--inv-text);
      border: 1.5px solid var(--border);
      padding: 9px 14px;
      border-radius: 0;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: var(--shadow-hard-sm);
      z-index: 60;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
      max-width: 340px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .loader-bar {
      height: 3px;
      background: var(--text);
      width: 0%;
      transition: width 0.2s ease;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 70;
    }

    @media (max-width: 640px) {
      .doc-page { padding: 20px 18px; }
      .file-name { max-width: 130px; }
      .topbar { padding: 8px 12px; }
    }

    /* Clean zero-watermark print / PDF export */
    @page {
      margin: 0;
    }
    @media print {
      .topbar, .notice-banner, .dropzone-wrap, .toast, .drag-overlay, .sheet-tabs, .loader-bar {
        display: none !important;
      }
      html, body, .app, .workspace, .viewer, .doc-page-wrap, .docx-host {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .docx-host .docx-wrapper {
        gap: 0 !important;
      }
      .docx-host .docx-wrapper > section.docx {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        page-break-after: always;
      }
      .doc-page {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        padding: 14mm !important;
      }
    }
  </style>
</head>
<body>
  <div class="loader-bar" id="loaderBar"></div>
  <div class="drag-overlay" id="dragOverlay"></div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
            <rect x="2" y="1" width="8" height="2"/>
            <rect x="10" y="3" width="2" height="2"/>
            <rect x="12" y="5" width="2" height="10"/>
            <rect x="2" y="13" width="10" height="2"/>
            <rect x="2" y="3" width="2" height="10"/>
            <rect x="5" y="6" width="5" height="2"/>
            <rect x="5" y="9" width="5" height="2"/>
          </svg>
        </span>
        <span>DocViewer</span>
      </div>

      <div class="file-meta" id="fileMeta"></div>

      <div class="actions">
        <input type="file" id="fileInput" hidden />
        <button type="button" id="openBtn" class="primary">
          <svg class="px-ico" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="1" y="3" width="5" height="2"/>
            <rect x="1" y="5" width="14" height="2"/>
            <rect x="1" y="7" width="2" height="6"/>
            <rect x="13" y="7" width="2" height="6"/>
            <rect x="3" y="11" width="10" height="2"/>
          </svg>
          <span id="openBtnLabel"></span>
        </button>

        <div class="convert-group">
          <select id="convertSelect" disabled></select>
          <button type="button" id="convertBtn" disabled>
            <svg class="px-ico" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
              <rect x="7" y="2" width="2" height="7"/>
              <rect x="5" y="7" width="2" height="2"/>
              <rect x="9" y="7" width="2" height="2"/>
              <rect x="7" y="9" width="2" height="2"/>
              <rect x="2" y="12" width="12" height="2"/>
            </svg>
            <span id="convertBtnLabel"></span>
          </button>
        </div>

        <button type="button" id="copyTextBtn" disabled>
          <svg class="px-ico" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="2" y="2" width="8" height="2"/>
            <rect x="2" y="4" width="2" height="8"/>
            <rect x="6" y="5" width="8" height="2"/>
            <rect x="6" y="7" width="2" height="7"/>
            <rect x="12" y="7" width="2" height="7"/>
            <rect x="8" y="12" width="4" height="2"/>
          </svg>
          <span id="copyBtnLabel"></span>
        </button>

        <button type="button" id="langBtn"></button>

        <button type="button" id="themeBtn">
          <svg class="px-ico" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="5" y="2" width="6" height="2"/>
            <rect x="3" y="4" width="2" height="2"/>
            <rect x="11" y="4" width="2" height="2"/>
            <rect x="2" y="6" width="2" height="4"/>
            <rect x="12" y="6" width="2" height="4"/>
            <rect x="3" y="10" width="2" height="2"/>
            <rect x="11" y="10" width="2" height="2"/>
            <rect x="5" y="12" width="6" height="2"/>
            <rect x="6" y="6" width="4" height="4"/>
          </svg>
          <span id="themeBtnLabel"></span>
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <div class="dropzone-wrap" id="dropzoneWrap">
        <div class="dropzone" id="dropzone" tabindex="0" role="button">
          <div class="drop-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
              <rect x="3" y="1" width="7" height="2"/>
              <rect x="10" y="3" width="2" height="2"/>
              <rect x="12" y="5" width="2" height="10"/>
              <rect x="2" y="13" width="10" height="2"/>
              <rect x="2" y="3" width="2" height="10"/>
              <rect x="7" y="6" width="2" height="5"/>
              <rect x="5" y="8" width="6" height="2"/>
            </svg>
          </div>
          <h1 id="dropTitle"></h1>
          <p id="dropDesc"></p>
          <div class="format-pills">
            <span class="badge accent">PDF</span>
            <span class="badge accent">DOCX</span>
            <span class="badge accent">DOC</span>
            <span class="badge">XLSX / CSV</span>
            <span class="badge">MD / TXT</span>
            <span class="badge">HTML / JSON</span>
            <span class="badge">PNG / JPG / WEBP</span>
          </div>
          <div class="drop-actions">
            <button type="button" id="pickBtn" class="primary"></button>
            <button type="button" id="demoBtn"></button>
          </div>
          <div class="hint-footer" id="hintFooter"></div>
        </div>
      </div>

      <div class="viewer" id="viewer"></div>
    </main>
  </div>

  <script>
    (() => {

      const loadedScripts = new Map();

      function loadScript(url) {
        if (loadedScripts.has(url)) return loadedScripts.get(url);
        const promise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = url;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => {
            loadedScripts.delete(url);
            reject(new Error('Failed to load: ' + url));
          };
          document.head.appendChild(s);
        });
        loadedScripts.set(url, promise);
        return promise;

      function extractTextFromLegacyDoc(buffer) {
        const bytes = new Uint8Array(buffer);
        const chunks = [];

        let current = [];
        for (let i = 0; i + 1 < bytes.length; i += 2) {
          const code = bytes[i] | (bytes[i + 1] << 8);
          const isPrintable =
            code === 10 || code === 13 || code === 9 ||
            (code >= 32 && code <= 126) ||
            (code >= 0x0400 && code <= 0x04FF);
          if (isPrintable) {
            current.push(code === 13 ? '\n' : String.fromCharCode(code));
          } else {
            if (current.length >= 12) {
              const str = current.join('').trim();
              if (/[a-zA-Zа-яА-ЯёЁіІїЇєЄґҐ0-9]{3,}/.test(str)) chunks.push(str);
            }
            current = [];
          }
        }
        if (current.length >= 12) {
          const str = current.join('').trim();
          if (/[a-zA-Zа-яА-ЯёЁіІїЇєЄґҐ0-9]{3,}/.test(str)) chunks.push(str);
        }

        let result = chunks.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
        if (result.length < 40) {
          const dec = new TextDecoder('windows-1251', { fatal: false });
          const raw = dec.decode(bytes);
          const matches = raw.match(/[A-Za-zА-Яа-яЁёІіЇїЄєҐґ0-9 ,.;:!?()"'«»\-–—\n]{16,}/g) || [];
          result = matches.map(s => s.trim()).filter(s => /[A-Za-zА-Яа-яЁёІіЇїЄєҐґ]{4,}/.test(s)).join('\n\n');
        }
        return result || t('docEmptyRead');
      }

      function parseCsv(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i], next = text[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') { cell += '"'; i++; }
            else if (ch === '"') { inQuotes = false; }
            else { cell += ch; }
          } else {
            if (ch === '"') { inQuotes = true; }
            else if (ch === ',' || ch === ';') { row.push(cell); cell = ''; }
            else if (ch === '\r' && next === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; }
            else if (ch === '\n' || ch === '\r') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else { cell += ch; }
          }
        }
        if (cell.length || row.length) { row.push(cell); rows.push(row); }
        return rows;
      }

      async function normalizeDocxUnits(buf) {
        try {
          const zip = await window.JSZip.loadAsync(buf);
          const docFile = zip.file('word/document.xml');
          if (!docFile) return buf;
          let xml = await docFile.async('string');
          // Fix non-twip units in w:pgMar / w:pgSz (e.g. Microsoft Teams exports "1in")
          if (/w:pgMar[^>]*?(?:in|cm|mm|pt)"/.test(xml)) {
            const toTwips = (_, attr, val, unit) => {
              const n = parseFloat(val);
              const mult = unit === 'in' ? 1440 : unit === 'cm' ? 566.93 : unit === 'mm' ? 56.693 : 20;
              return `${attr}="${Math.round(n * mult)}"`;
            };
            xml = xml.replace(/(w:(?:top|right|bottom|left|header|footer|gutter))="([0-9.]+)(in|cm|mm|pt)"/g, toTwips);
            zip.file('word/document.xml', xml);
            return await zip.generateAsync({ type: 'arraybuffer' });
          }
        } catch {}
        return buf;
      }

      function extractTextFromRtf(rtf) {
        return rtf
          .replace(/\\par[d]?/g, '\n')
          .replace(/\\tab/g, '\t')
          .replace(/\\'([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)))
          .replace(/\{\\\*\\[^}]+\}/g, '')
          .replace(/\\[a-zA-Z]+-?\d* ?/g, '')
          .replace(/[{}]/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function splitOversizedParagraph(pEl, maxH) {
        const text = pEl.textContent || '';
        if (text.length < 200 || pEl.querySelector('table')) return [pEl];

        // Preserve original typography from the longest text span inside the paragraph
        const spans = Array.from(pEl.querySelectorAll('span'));
        let mainSpanStyle = '';
        if (spans.length) {
          const longest = spans.reduce((a, b) => (b.textContent.length > a.textContent.length ? b : a), spans[0]);
          const lcs = getComputedStyle(longest);
          mainSpanStyle = `font-family:${lcs.fontFamily};font-size:${lcs.fontSize};color:${lcs.color};line-height:${lcs.lineHeight};`;
        }

        const imgs = Array.from(pEl.querySelectorAll('img')).map(img => img.cloneNode(true));
        const words = text.split(/(\s+)/);
        const chunks = [];
        const probe = pEl.cloneNode(false);
        probe.style.cssText += ';visibility:hidden;position:absolute;left:-9999px;width:' + pEl.getBoundingClientRect().width + 'px;' + mainSpanStyle;
        pEl.parentNode.insertBefore(probe, pEl);

        // Binary-search-like fast chunking by word batches
        let start = 0;
        while (start < words.length) {
          let lo = start + 1, hi = words.length, best = start + 1;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            probe.textContent = words.slice(start, mid).join('');
            if (probe.getBoundingClientRect().height <= maxH) {
              best = mid;
              lo = mid + 1;
            } else {
              hi = mid - 1;
            }
          }
          const part = words.slice(start, best).join('').trim();
          if (part) chunks.push(part);
          start = best;
        }
        probe.remove();

        if (chunks.length <= 1) return [pEl];
        return chunks.map((chunk, idx) => {
          const clone = pEl.cloneNode(false);
          if (idx === 0 && imgs.length) {
            imgs.forEach(im => clone.appendChild(im));
          }
          const span = document.createElement('span');
          if (mainSpanStyle) span.style.cssText = mainSpanStyle;
          span.textContent = chunk;
          clone.appendChild(span);
          return clone;
        });
      }

      function paginateDocxSections(host) {
        const wrapper = host.querySelector('.docx-wrapper');
        if (!wrapper) return;
        const sections = Array.from(wrapper.querySelectorAll(':scope > section.docx'));
        sections.forEach(sec => {
          const cs = getComputedStyle(sec);
          const padTop = parseFloat(cs.paddingTop) || 0;
          const padBot = parseFloat(cs.paddingBottom) || 0;
          const minH = parseFloat(cs.minHeight) || 1122;
          const maxContentH = Math.max(300, minH - padTop - padBot);

          if (sec.scrollHeight <= minH + 12) return;

          const article = sec.querySelector(':scope > article') || sec;
          let blocks = Array.from(article.children);
          if (blocks.length === 0) return;

          // Split any single giant paragraph (e.g. 14,000-char transcript block)
          const expanded = [];
          blocks.forEach(b => {
            const h = b.getBoundingClientRect().height;
            if (b.tagName === 'P' && h > maxContentH * 0.9) {
              const parts = splitOversizedParagraph(b, maxContentH * 0.85);
              parts.forEach(p => {
                if (p !== b) article.insertBefore(p, b);
                expanded.push(p);
              });
              if (parts[0] !== b) b.remove();
            } else {
              expanded.push(b);
            }
          });
          blocks = expanded;
          if (blocks.length <= 1) return;

          const heights = blocks.map(b => {
            const bcs = getComputedStyle(b);
            return b.getBoundingClientRect().height + (parseFloat(bcs.marginTop) || 0) + (parseFloat(bcs.marginBottom) || 0);
          });

          const pages = [];
          let current = [];
          let accH = 0;

          for (let i = 0; i < blocks.length; i++) {
            const h = heights[i];
            if (current.length > 0 && accH + h > maxContentH) {
              pages.push(current);
              current = [blocks[i]];
              accH = h;
            } else {
              current.push(blocks[i]);
              accH += h;
            }
          }
          if (current.length) pages.push(current);
          if (pages.length <= 1) return;

          const headerEl = sec.querySelector(':scope > header');
          const footerEl = sec.querySelector(':scope > footer');

          pages.forEach((group, idx) => {
            if (idx === 0) return;
            const newSec = document.createElement('section');
            newSec.className = sec.className;
            newSec.style.cssText = sec.style.cssText;
            if (headerEl) newSec.appendChild(headerEl.cloneNode(true));

            if (article !== sec) {
              const newArt = document.createElement('article');
              newArt.className = article.className;
              newArt.style.cssText = article.style.cssText;
              group.forEach(node => newArt.appendChild(node));
              newSec.appendChild(newArt);
            } else {
              group.forEach(node => newSec.appendChild(node));
            }

            if (footerEl) newSec.appendChild(footerEl.cloneNode(true));
            wrapper.insertBefore(newSec, sec.nextSibling);
            sec = newSec;
          });
        });
      }

      function fitDocxScale(host) {
        const wrapper = host.querySelector('.docx-wrapper');
        if (!wrapper) return;
        const firstPage = wrapper.querySelector(':scope > section.docx');
        if (!firstPage) return;
        const avail = host.clientWidth - 32;
        const pageW = firstPage.offsetWidth;
        if (pageW > avail && avail > 200) {
          wrapper.style.zoom = (avail / pageW).toFixed(3);
        } else {
          wrapper.style.zoom = '';
        }
      }

      window.addEventListener('resize', () => {
        const host = el.viewer.querySelector('.docx-host');
        if (host) fitDocxScale(host);
      });

      function renderHtmlPage(htmlContent, noticeText = '') {
        el.viewer.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'doc-page-wrap';

        if (noticeText) {
          const banner = document.createElement('div');
          banner.className = 'notice-banner';
          banner.textContent = noticeText;
          wrap.appendChild(banner);
        }

        const page = document.createElement('article');
        page.className = 'doc-page';
        page.innerHTML = htmlContent;
        wrap.appendChild(page);
        el.viewer.appendChild(wrap);
      }

      async function openFile(file) {
        if (!file) return;
        const t0 = performance.now();
        setProgress(30);
        cleanupPrevious();
        state.file = file;
        const ext = getExt(file.name);
        state.ext = ext;

        el.dropzoneWrap.style.display = 'none';
        el.viewer.classList.add('active');
        el.viewer.innerHTML = '';

        try {
          if (ext === 'pdf' || file.type === 'application/pdf') {
            state.kind = 'pdf';
            state.blobUrl = URL.createObjectURL(file);
            const iframe = document.createElement('iframe');
            iframe.className = 'pdf-frame';
            iframe.src = state.blobUrl;
            iframe.title = file.name;
            el.viewer.appendChild(iframe);
            el.copyTextBtn.disabled = false;
          }
          else if (ext === 'docx') {
            state.kind = 'docx';
            setProgress(45);
            await loadScript(CDN.jszip);
            setProgress(65);
            await loadScript(CDN.docxPreview);
            let buf = await file.arrayBuffer();
            buf = await normalizeDocxUnits(buf);

            const host = document.createElement('div');
            host.className = 'docx-host';
            el.viewer.appendChild(host);

            try {
              await window.docx.renderAsync(buf, host, null, {
                className: 'docx',
                inWrapper: true,
                ignoreWidth: false,
                ignoreHeight: false,
                ignoreFonts: false,
                breakPages: true,
                ignoreLastRenderedPageBreak: false,
                experimental: true,
                useBase64URL: true
              });

              paginateDocxSections(host);
              fitDocxScale(host);
              state.html = host.innerHTML;
              state.text = host.innerText || '';
            } catch (docxErr) {
              // Universal fallback to Mammoth if docx-preview hits malformed XML
              await loadScript(CDN.mammoth);
              const res = await window.mammoth.convertToHtml({ arrayBuffer: buf });
              const rawRes = await window.mammoth.extractRawText({ arrayBuffer: buf });
              state.html = res.value || '';
              state.text = rawRes.value || '';
              renderHtmlPage(state.html);
            }
            el.copyTextBtn.disabled = !state.text.trim();
          }
          else if (ext === 'rtf') {
            state.kind = 'doc';
            const raw = await file.text();
            state.text = extractTextFromRtf(raw);
            state.html = state.text
              .split(/\n{2,}/)
              .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
              .join('');
            renderHtmlPage(state.html);
            el.copyTextBtn.disabled = !state.text.trim();
          }
          else if (ext === 'doc') {
            state.kind = 'doc';
            const buf = await file.arrayBuffer();
            state.text = extractTextFromLegacyDoc(buf);
            state.html = state.text
              .split(/\n{2,}/)
              .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
              .join('');
            renderHtmlPage(state.html, t('docNotice'));
            el.copyTextBtn.disabled = false;
          }
          else if (['xlsx', 'xls', 'ods'].includes(ext)) {
            state.kind = 'sheet';
            setProgress(55);
            await loadScript(CDN.xlsx);
            const buf = await file.arrayBuffer();
            const wb = window.XLSX.read(buf, { type: 'array' });
            state.workbook = wb;
            renderWorkbook(wb, wb.SheetNames[0]);
            el.copyTextBtn.disabled = false;
          }
          else if (ext === 'csv' || ext === 'tsv') {
            state.kind = 'sheet';
            const txt = await file.text();
            state.text = txt;
            const rows = parseCsv(txt);
            const tableHtml = '<table>' + rows.map((r, idx) => {
              const tag = idx === 0 ? 'th' : 'td';
              return '<tr>' + r.map(c => `<${tag}>${escapeHtml(c)}</${tag}>`).join('') + '</tr>';
            }).join('') + '</table>';
            state.html = tableHtml;
            renderHtmlPage(tableHtml);
            el.copyTextBtn.disabled = false;
          }
          else if (ext === 'md' || ext === 'markdown') {
            state.kind = 'markdown';
            const txt = await file.text();
            state.text = txt;
            try {
              await loadScript(CDN.marked);
              state.html = window.marked.parse(txt);
            } catch {
              state.html = `<pre>${escapeHtml(txt)}</pre>`;
            }
            renderHtmlPage(state.html);
            el.copyTextBtn.disabled = false;
          }
          else if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'svg', 'bmp'].includes(ext) || file.type.startsWith('image/')) {
            state.kind = 'image';
            state.blobUrl = URL.createObjectURL(file);
            const wrap = document.createElement('div');
            wrap.className = 'img-view';
            const img = document.createElement('img');
            img.src = state.blobUrl;
            img.alt = file.name;
            state.imageEl = img;
            wrap.appendChild(img);
            el.viewer.appendChild(wrap);
            el.copyTextBtn.disabled = true;
          }
          else if (ext === 'html' || ext === 'htm') {
            state.kind = 'text';
            const txt = await file.text();
            state.text = txt;
            state.html = txt;
            state.blobUrl = URL.createObjectURL(new Blob([txt], { type: 'text/html;charset=utf-8' }));
            const iframe = document.createElement('iframe');
            iframe.className = 'pdf-frame';
            iframe.style.background = '#fff';
            iframe.sandbox = 'allow-same-origin';
            iframe.src = state.blobUrl;
            el.viewer.appendChild(iframe);
            el.copyTextBtn.disabled = false;
          }
          else {
            state.kind = 'text';
            const txt = await file.text();
            state.text = txt;
            let formatted = txt;
            if (ext === 'json') {
              try { formatted = JSON.stringify(JSON.parse(txt), null, 2); } catch {}
            }
            state.html = `<pre><code>${escapeHtml(formatted)}</code></pre>`;
            renderHtmlPage(state.html);
            el.copyTextBtn.disabled = false;
          }

          populateConvertOptions(state.kind);
          state.elapsedMs = Math.max(1, Math.round(performance.now() - t0));
          updateMetaBar(file, ext, state.elapsedMs);
          setProgress(100);
        } catch (err) {
          setProgress(100);
          renderHtmlPage(`<p style="color:var(--danger)"><strong>${t('openError')}:</strong> ${escapeHtml(err.message || String(err))}</p>`);
          showToast(t('openErrorToast'));
        }
      }

      function renderWorkbook(wb, sheetName) {
        const ws = wb.Sheets[sheetName];
        const html = window.XLSX.utils.sheet_to_html(ws);
        state.html = html;
        state.text = window.XLSX.utils.sheet_to_csv(ws);
        state.currentSheet = sheetName;

        el.viewer.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'doc-page-wrap';

        if (wb.SheetNames.length > 1) {
          const tabs = document.createElement('div');
          tabs.className = 'sheet-tabs';
          wb.SheetNames.forEach(name => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'sheet-tab' + (name === sheetName ? ' active' : '');
            b.textContent = name;
            b.addEventListener('click', () => renderWorkbook(wb, name));
            tabs.appendChild(b);
          });
          wrap.appendChild(tabs);
        }

        const page = document.createElement('article');
        page.className = 'doc-page';
        page.style.maxWidth = '1000px';
        page.innerHTML = html;
        wrap.appendChild(page);
        el.viewer.appendChild(wrap);
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function htmlToSimpleMarkdown(htmlStr) {
        const doc = new DOMParser().parseFromString(htmlStr, 'text/html');
        doc.querySelectorAll('style, script').forEach(n => n.remove());
        function walk(node) {
          if (node.nodeType === 3) return node.textContent;
          if (node.nodeType !== 1) return '';
          const tag = node.tagName.toLowerCase();
          const inner = Array.from(node.childNodes).map(walk).join('');
          switch (tag) {
            case 'h1': return `# ${inner.trim()}\n\n`;
            case 'h2': return `## ${inner.trim()}\n\n`;
            case 'h3': return `### ${inner.trim()}\n\n`;
            case 'h4': return `#### ${inner.trim()}\n\n`;
            case 'p': return `${inner.trim()}\n\n`;
            case 'strong': case 'b': return `**${inner}**`;
            case 'em': case 'i': return `*${inner}*`;
            case 'li': return `- ${inner.trim()}\n`;
            case 'ul': case 'ol': return `${inner}\n`;
            case 'br': return '\n';
            default: return inner;
          }
        }
        return walk(doc.body).replace(/\n{3,}/g, '\n\n').trim();
      }

      async function extractPdfText() {
        setProgress(35);
        await loadScript(CDN.pdfjs);
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
        const buf = await state.file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
        const pages = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          setProgress(35 + Math.round((i / pdf.numPages) * 60));
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          pages.push(`--- ${t('pageLabel')} ${i} ---\n` + content.items.map(it => it.str).join(' '));
        }
        setProgress(100);
        return pages.join('\n\n');
      }

      function cleanPrint(fileTitle) {
        const prevTitle = document.title;
        document.title = fileTitle || 'Document';
        showToast(t('printHint'));
        setTimeout(() => {
          window.print();
          document.title = prevTitle;
        }, 120);
      }

      async function convertAndDownload() {
        const target = el.convertSelect.value;
        if (!target || !state.file) return;
        const name = baseName(state.file.name);

        try {
          if (target === 'pdf') {
            if (state.kind === 'image' && state.imageEl) {
              const w = window.open('', '_blank');
              if (w) {
                w.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(name)}</title><style>@page{margin:0}body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:100%;height:auto}</style></head><body><img src="${state.blobUrl}"></body></html>`);
                w.document.close();
                w.focus();
                w.print();
              } else {
                cleanPrint(name);
              }
            } else {
              cleanPrint(name);
            }
            return;
          }

          if (state.kind === 'pdf' && target === 'txt') {
            showToast(t('extractingPdf'));
            const text = await extractPdfText();
            state.text = text;
            downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), `${name}.txt`);
            showToast(t('savedPrefix') + `${name}.txt`);
            return;
          }

          if (state.kind === 'pdf' && target === 'png') {
            showToast(t('renderingPng'));
            setProgress(30);
            await loadScript(CDN.pdfjs);
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
            const buf = await state.file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
            const limit = Math.min(pdf.numPages, 15);
            for (let i = 1; i <= limit; i++) {
              setProgress(30 + Math.round((i / limit) * 65));
              const page = await pdf.getPage(i);
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
              const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
              if (blob) downloadBlob(blob, `${name}_page_${i}.png`);
            }
            setProgress(100);
            showToast(pdf.numPages > 15 ? t('savedPngLimit') : t('savedPngAll'));
            return;
          }

          if (target === 'html') {
            const cleanBody = state.kind === 'docx'
              ? state.html
              : `<div style="max-width:820px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.6;color:#111">${state.html}</div>`;
            const docHtml = `<!DOCTYPE html><html lang="${state.lang}"><head><meta charset="UTF-8"><title>${escapeHtml(name)}</title><style>body{margin:0;background:#fff;color:#000}table{border-collapse:collapse}th,td{border:1px solid #d1d5db;padding:6px 10px}</style></head><body>${cleanBody}</body></html>`;
            downloadBlob(new Blob([docHtml], { type: 'text/html;charset=utf-8' }), `${name}.html`);
            showToast(t('savedPrefix') + `${name}.html`);
            return;
          }

          if (target === 'txt') {
            downloadBlob(new Blob([state.text || ''], { type: 'text/plain;charset=utf-8' }), `${name}.txt`);
            showToast(t('savedPrefix') + `${name}.txt`);
            return;
          }

          if (target === 'md') {
            const md = htmlToSimpleMarkdown(state.html);
            downloadBlob(new Blob([md], { type: 'text/markdown;charset=utf-8' }), `${name}.md`);
            showToast(t('savedPrefix') + `${name}.md`);
            return;
          }

          if (target === 'csv') {
            downloadBlob(new Blob([state.text || ''], { type: 'text/csv;charset=utf-8' }), `${name}.csv`);
            showToast(t('savedPrefix') + `${name}.csv`);
            return;
          }

          if (target === 'json') {
            let jsonText = '';
            if (state.workbook && window.XLSX) {
              const ws = state.workbook.Sheets[state.currentSheet || state.workbook.SheetNames[0]];
              jsonText = JSON.stringify(window.XLSX.utils.sheet_to_json(ws), null, 2);
            } else {
              const rows = parseCsv(state.text || '');
              jsonText = JSON.stringify(rows, null, 2);
            }
            downloadBlob(new Blob([jsonText], { type: 'application/json;charset=utf-8' }), `${name}.json`);
            showToast(t('savedPrefix') + `${name}.json`);
            return;
          }

          if (state.kind === 'image' && ['png', 'jpeg', 'webp'].includes(target) && state.imageEl) {
            const img = state.imageEl;
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            if (target === 'jpeg') {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0);
            const mime = 'image/' + target;
            const blob = await new Promise(res => canvas.toBlob(res, mime, 0.92));
            if (blob) {
              const outExt = target === 'jpeg' ? 'jpg' : target;
              downloadBlob(blob, `${name}.${outExt}`);
              showToast(t('savedPrefix') + `${name}.${outExt}`);
            }
          }
        } catch (err) {
          setProgress(100);
          showToast(t('convertError') + (err.message || err));
        }
      }

      async function copyTextToClipboard() {
        let txt = state.text;
        if (!txt && state.kind === 'pdf') {
          try {
            showToast(t('extractingPdf'));
            txt = await extractPdfText();
            state.text = txt;
          } catch {
            showToast(t('copyFailed'));
            return;
          }
        }
        if (!txt) return;
        try {
          await navigator.clipboard.writeText(txt);
          showToast(t('copied'));
        } catch {
          const ta = document.createElement('textarea');
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast(t('copied'));
        }
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('docviewer_theme', isDark ? 'dark' : 'light'); } catch {}
      }

      function toggleLanguage() {
        state.lang = state.lang === 'uk' ? 'en' : 'uk';
        try { localStorage.setItem('docviewer_lang', state.lang); } catch {}
        applyLanguage();
      }

      try {
        if (localStorage.getItem('docviewer_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch {}

      applyLanguage();

      // Event Listeners
      el.openBtn.addEventListener('click', () => el.fileInput.click());
      el.pickBtn.addEventListener('click', (e) => { e.stopPropagation(); el.fileInput.click(); });
      el.dropzone.addEventListener('click', () => el.fileInput.click());
      el.dropzone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.fileInput.click(); }
      });

      el.fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) openFile(e.target.files[0]);
        e.target.value = '';
      });

      el.convertSelect.addEventListener('change', () => {
        el.convertBtn.disabled = !el.convertSelect.value;
      });
      el.convertBtn.addEventListener('click', convertAndDownload);
      el.copyTextBtn.addEventListener('click', copyTextToClipboard);
      el.themeBtn.addEventListener('click', toggleTheme);
      el.langBtn.addEventListener('click', toggleLanguage);

      el.demoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const demoFile = new File([t('demoBody')], t('demoFile'), { type: 'text/markdown' });
        openFile(demoFile);
      });

      // Global Drag & Drop
      let dragDepth = 0;
      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragDepth++;
        el.dropzone.classList.add('dragover');
        if (state.file) el.dragOverlay.classList.add('visible');
      });
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) {
          el.dropzone.classList.remove('dragover');
          el.dragOverlay.classList.remove('visible');
        }
      });
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragDepth = 0;
        el.dropzone.classList.remove('dragover');
        el.dragOverlay.classList.remove('visible');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) openFile(f);
      });

      // Ctrl+O shortcut
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          el.fileInput.click();
        }
      });
    })();
  </script>
</body>
</html>
